[project]
name = "rules-farmer"
version = "0.1.0"
description = "Multi-agent IDS rule generation and validation system."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agno>=2.2.0",
    "anthropic>=0.75.0",
    "fastapi>=0.124.0",
    "openai>=1.0.0",
    "paramiko>=4.0.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.0",
    "uvicorn>=0.38.0",
]

[project.scripts]
rules-farmer = "rules_farmer.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require Docker, SSH, or live testbed infrastructure",
]
