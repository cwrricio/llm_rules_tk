ssh_retry:
  max_attempts: 3
  base_delay_seconds: 1

attack_plan_validation:
  max_retries: 5

experiment_defaults:
  # max_iterations: tentativas internas do LLM para gerar uma regra que detecte o ataque em um único
  # ciclo (base ou pós-evasão). Esgotou sem detectar => o ciclo registra fired=false.
  max_iterations: 10
  # variant_count: quantas variações do ataque devem ser tentadas após o base. O loop externo roda
  # 1 base + variant_count variações. Quando a regra atual está detectando, cada iteração apenas
  # varia o ataque sob a MESMA regra (sem novo SID). Quando uma variante escapa, a próxima
  # iteração obriga o LLM a gerar regra nova.
  variant_count: 49
  continue_on_failure: true
  # convergence_threshold: contador de fireds consecutivos para encerrar com status="converged".
  # Regra:
  #   - inicia em 0 no base (o base NUNCA incrementa, mesmo com fired=True)
  #   - cada variante com fired=True       => contador += 1
  #   - cada variante com fired=False      => contador = 0
  #   - contador >= convergence_threshold  => encerra com status="converged"
  # Como uma variante que falha também zera active_rule (forçando o LLM a gerar regra nova na
  # próxima), o contador efetivamente mede TRUEs consecutivos sob a MESMA regra ativa.
  convergence_threshold: 20

testbed:
  ids_alert_log_path: /home/gtiotedu/ataques-regras-e-assinaturas/snort/logs/alert_fast.txt
  ids_rules_file_path: /home/gtiotedu/ataques-regras-e-assinaturas/snort/rules/temp/rules_farmer_ai.rules
  ids_rules_include_file_path: /home/gtiotedu/ataques-regras-e-assinaturas/snort/rules/all.rules
  ids_rule_include_statement: include rules/temp/rules_farmer_ai.rules
  ids_container_name: snort_ids
  ids_snort_config_path: /opt/snort3/etc/snort/snort.lua
  attacker_attacks_root: /home/unipampa/ataques-artigo
  attacker_capture_interface: any
  sid_counter_file_path: ./data/sid_counter.json
  experiment_counter_file_path: ./data/experiment_counter.json
  results_output_dir: ./results
  validated_rules_dir: ./data/validated_rules

